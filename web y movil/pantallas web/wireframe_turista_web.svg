<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .nav-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 8px; }
      .map-bg { fill: #E2E8F0; }
      .map-road { stroke: #CBD5E1; stroke-width: 3; stroke-dasharray: 6 4; fill: none; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-main { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #1E293B; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #64748B; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 26px; fill: #0F172A; }
      .txt-chip { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #334155; }
      .chip-active-bg { fill: #0F172A; rx: 16px; }
      .chip-active-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #FFFFFF; }
      .chip-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 16px; }
      .btn-primary { fill: #0F172A; rx: 6px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #FFFFFF; text-anchor: middle; }
      .btn-outline { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .badge { fill: #EEF2F6; rx: 4px; }
      .badge-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="900" class="bg" />

  <!-- TOP NAVBAR (1440 x 70) -->
  <g id="Navbar">
    <rect width="1440" height="70" class="nav-bg" />
    
    <!-- Logo / Brand -->
    <circle cx="50" cy="35" r="14" fill="#0F172A" />
    <path d="M44 38 L50 28 L56 38 Z" fill="#FFFFFF" />
    <text x="74" y="42" class="txt-brand">Sendaria <tspan fill="#64748B" font-weight="400">Chile</tspan></text>

    <!-- Nav Links -->
    <text x="380" y="41" class="txt-main" fill="#0F172A">Explorar Mapa</text>
    <rect x="375" y="66" width="95" height="4" fill="#0F172A" rx="2" />
    <text x="510" y="41" class="txt-muted">Destinos</text>
    <text x="610" y="41" class="txt-muted">Regiones</text>
    <text x="710" y="41" class="txt-muted">Guías de Viaje</text>

    <!-- User Action / Portal Switch -->
    <g transform="translate(1180, 17)">
      <rect width="120" height="36" class="btn-outline" />
      <text x="60" y="23" class="txt-main" text-anchor="middle">Acceso Admin</text>
    </g>
    <circle cx="1340" cy="35" r="18" fill="#E2E8F0" stroke="#CBD5E1" />
    <text x="1340" y="40" font-family="Inter, sans-serif" font-size="12" fill="#475569" text-anchor="middle">ES</text>
  </g>

  <!-- SEARCH & CATEGORY BAR (Sub-header) -->
  <g id="Search_Bar_Header" transform="translate(0, 70)">
    <rect width="1440" height="95" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Big Search Input Box -->
    <g transform="translate(40, 20)">
      <rect width="460" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <!-- Search Icon -->
      <circle cx="28" cy="27" r="7" stroke="#64748B" stroke-width="2" fill="none" />
      <line x1="33" y1="32" x2="41" y2="40" stroke="#64748B" stroke-width="2" />
      <text x="54" y="32" class="txt-muted">¿Qué lugar de Chile deseas explorar? (ej. Torres del Paine)...</text>
    </g>

    <!-- Category Filter Chips -->
    <g transform="translate(520, 30)">
      <!-- Chip 1 (Active) -->
      <rect x="0" y="0" width="86" height="36" class="chip-active-bg" />
      <text x="43" y="23" class="chip-active-txt" text-anchor="middle">Todos</text>

      <!-- Chip 2 -->
      <rect x="96" y="0" width="130" height="36" class="chip-bg" />
      <text x="161" y="23" class="txt-chip" text-anchor="middle">Parques Nac.</text>

      <!-- Chip 3 -->
      <rect x="236" y="0" width="105" height="36" class="chip-bg" />
      <text x="288" y="23" class="txt-chip" text-anchor="middle">Montañas</text>

      <!-- Chip 4 -->
      <rect x="351" y="0" width="90" height="36" class="chip-bg" />
      <text x="396" y="23" class="txt-chip" text-anchor="middle">Playas</text>

      <!-- Chip 5 -->
      <rect x="451" y="0" width="95" height="36" class="chip-bg" />
      <text x="498" y="23" class="txt-chip" text-anchor="middle">Termas</text>

      <!-- Chip 6 -->
      <rect x="556" y="0" width="100" height="36" class="chip-bg" />
      <text x="606" y="23" class="txt-chip" text-anchor="middle">Patrimonio</text>

      <!-- Region Filter Dropdown -->
      <rect x="680" y="0" width="180" height="36" class="btn-outline" />
      <text x="700" y="23" class="txt-main">Región: Todas</text>
      <polygon points="840,21 848,21 844,26" fill="#64748B" />
    </g>
  </g>

  <!-- MAIN WORKSPACE: SPLIT SCREEN (Sidebar List 480px + Google Maps View 960px) -->
  <g id="Main_Content" transform="translate(0, 165)">
    
    <!-- LEFT PANEL: DESTINATIONS FEED (Width: 460px) -->
    <g id="Sidebar_List" transform="translate(40, 20)">
      <text x="0" y="24" class="txt-title">Destinos recomendados</text>
      <text x="0" y="44" class="txt-muted">Mostrando 48 atractivos geolocalizados</text>

      <!-- CARD 1 -->
      <g transform="translate(0, 60)">
        <rect width="440" height="135" class="card-bg" />
        <!-- Thumbnail Placeholder -->
        <rect x="12" y="12" width="130" height="111" rx="6" fill="#E2E8F0" />
        <path d="M50 75 L70 50 L95 80 L110 65 L130 85" stroke="#94A3B8" stroke-width="2" fill="none" />
        <!-- Info -->
        <rect x="156" y="16" width="90" height="20" class="badge" />
        <text x="166" y="30" class="badge-txt">PARQUE NACIONAL</text>
        <text x="156" y="56" class="txt-main" font-size="16">Torres del Paine</text>
        <text x="156" y="74" class="txt-muted" font-size="12">Magallanes y Antártica Chilena</text>
        <text x="156" y="94" class="txt-muted" font-size="12">★ 4.9 (1,420 reseñas) • Senderismo</text>
        <!-- Action Link -->
        <text x="156" y="116" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Ver detalles e itinerario →</text>
      </g>

      <!-- CARD 2 -->
      <g transform="translate(0, 210)">
        <rect width="440" height="135" class="card-bg" />
        <!-- Thumbnail Placeholder -->
        <rect x="12" y="12" width="130" height="111" rx="6" fill="#E2E8F0" />
        <path d="M50 75 L70 50 L95 80 L110 65 L130 85" stroke="#94A3B8" stroke-width="2" fill="none" />
        <!-- Info -->
        <rect x="156" y="16" width="60" height="20" class="badge" />
        <text x="166" y="30" class="badge-txt">DESIERTO</text>
        <text x="156" y="56" class="txt-main" font-size="16">Valle de la Luna</text>
        <text x="156" y="74" class="txt-muted" font-size="12">San Pedro de Atacama, Antofagasta</text>
        <text x="156" y="94" class="txt-muted" font-size="12">★ 4.8 (980 reseñas) • Paisajismo</text>
        <text x="156" y="116" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Ver detalles e itinerario →</text>
      </g>

      <!-- CARD 3 -->
      <g transform="translate(0, 360)">
        <rect width="440" height="135" class="card-bg" />
        <!-- Thumbnail Placeholder -->
        <rect x="12" y="12" width="130" height="111" rx="6" fill="#E2E8F0" />
        <path d="M50 75 L70 50 L95 80 L110 65 L130 85" stroke="#94A3B8" stroke-width="2" fill="none" />
        <!-- Info -->
        <rect x="156" y="16" width="80" height="20" class="badge" />
        <text x="166" y="30" class="badge-txt">PATRIMONIO</text>
        <text x="156" y="56" class="txt-main" font-size="16">Cerros de Valparaíso</text>
        <text x="156" y="74" class="txt-muted" font-size="12">Valparaíso, Región de Valparaíso</text>
        <text x="156" y="94" class="txt-muted" font-size="12">★ 4.7 (2,150 reseñas) • Cultura & Arte</text>
        <text x="156" y="116" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Ver detalles e itinerario →</text>
      </g>

      <!-- Pagination indicator -->
      <g transform="translate(130, 510)">
        <text x="0" y="15" class="txt-muted" font-size="12">Página 1 de 6</text>
        <rect x="90" y="0" width="30" height="24" class="btn-outline" />
        <text x="105" y="16" class="txt-main" font-size="12" text-anchor="middle">&lt;</text>
        <rect x="125" y="0" width="30" height="24" class="btn-primary" />
        <text x="140" y="16" class="btn-primary-txt" font-size="12" text-anchor="middle">&gt;</text>
      </g>
    </g>

    <!-- RIGHT PANEL: INTERACTIVE GOOGLE MAP (Width: 880px, Height: 695px) -->
    <g id="Map_Area" transform="translate(520, 20)">
      <!-- Map base -->
      <rect width="880" height="695" rx="12" class="map-bg" stroke="#CBD5E1" stroke-width="1" />
      
      <!-- Roads/Topography Lines -->
      <path d="M 120 0 Q 240 180 320 350 T 560 695" class="map-road" />
      <path d="M 450 0 Q 400 220 620 400 T 800 695" class="map-road" />
      <path d="M 0 320 Q 300 280 880 480" class="map-road" />
      <path d="M 0 540 Q 400 500 880 620" class="map-road" />

      <!-- Chilean Geography Silhouette Mock -->
      <path d="M 280 40 Q 295 120 270 240 T 310 480 T 260 650" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />

      <!-- Marker 1 (Active / Selected) -->
      <g transform="translate(290, 180)">
        <ellipse cx="0" cy="18" rx="8" ry="4" fill="#000000" opacity="0.2" />
        <path d="M 0 -18 C -10 -18 -16 -10 -16 0 C -16 12 0 24 0 24 C 0 24 16 12 16 0 C 16 -10 10 -18 0 -18 Z" fill="#0F172A" />
        <circle cx="0" cy="-3" r="5" fill="#FFFFFF" />
      </g>
      <!-- Floating Popup on Marker 1 -->
      <g transform="translate(315, 130)">
        <rect width="210" height="75" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
        <polygon points="-8,25 0,20 0,30" fill="#FFFFFF" />
        <text x="14" y="24" class="txt-main" font-size="13">Valle de la Luna</text>
        <text x="14" y="40" class="txt-muted" font-size="11">San Pedro • Abierto hoy</text>
        <text x="14" y="58" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#2563EB">Clic para centrar ficha</text>
      </g>

      <!-- Marker 2 -->
      <g transform="translate(270, 320)">
        <ellipse cx="0" cy="18" rx="7" ry="3" fill="#000000" opacity="0.2" />
        <path d="M 0 -16 C -9 -16 -14 -9 -14 0 C -14 10 0 20 0 20 C 0 20 14 10 14 0 C 14 -9 9 -16 0 -16 Z" fill="#475569" />
        <circle cx="0" cy="-3" r="4" fill="#FFFFFF" />
      </g>

      <!-- Marker 3 -->
      <g transform="translate(330, 480)">
        <ellipse cx="0" cy="18" rx="7" ry="3" fill="#000000" opacity="0.2" />
        <path d="M 0 -16 C -9 -16 -14 -9 -14 0 C -14 10 0 20 0 20 C 0 20 14 10 14 0 C 14 -9 9 -16 0 -16 Z" fill="#475569" />
        <circle cx="0" cy="-3" r="4" fill="#FFFFFF" />
      </g>

      <!-- Google Maps UI Standard Controls Mock -->
      <g transform="translate(20, 20)">
        <rect width="130" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <text x="65" y="21" class="txt-main" font-size="12" text-anchor="middle">Mapa  |  Satélite</text>
      </g>

      <!-- Zoom Buttons -->
      <g transform="translate(820, 580)">
        <rect width="36" height="74" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <line x1="8" y1="37" x2="28" y2="37" stroke="#E2E8F0" stroke-width="1" />
        <text x="18" y="24" font-family="Inter, sans-serif" font-size="18" fill="#1E293B" text-anchor="middle">+</text>
        <text x="18" y="61" font-family="Inter, sans-serif" font-size="18" fill="#1E293B" text-anchor="middle">−</text>
      </g>

      <!-- Location Button -->
      <g transform="translate(820, 530)">
        <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <circle cx="18" cy="18" r="5" fill="#0F172A" />
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .nav-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-auth { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 12px; }
      .input-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .input-box-error { fill: #FEF2F2; stroke: #EF4444; stroke-width: 1.5; rx: 6px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #0F172A; }
      .txt-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #334155; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748B; }
      .txt-placeholder { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
      .txt-error { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #DC2626; }
      .btn-primary { fill: #0F172A; rx: 6px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #FFFFFF; text-anchor: middle; }
      .checkbox-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 4px; }
      .checkbox-checked { fill: #0F172A; rx: 4px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" class="bg" />

  <!-- TOP NAVBAR -->
  <g id="Navbar">
    <rect width="1440" height="70" class="nav-bg" />
    <circle cx="50" cy="35" r="14" fill="#0F172A" />
    <path d="M44 38 L50 28 L56 38 Z" fill="#FFFFFF" />
    <text x="74" y="42" class="txt-brand">Sendaria <tspan fill="#64748B" font-weight="400">Chile</tspan></text>
    <text x="320" y="41" font-family="Inter, sans-serif" font-size="13" fill="#64748B">← Volver al portal turístico</text>
  </g>

  <!-- MAIN REGISTRATION CARD CONTAINER (520px de ancho centrado) -->
  <g id="Register_Card" transform="translate(460, 95)">
    <rect width="520" height="730" class="card-auth" />

    <!-- Card Header -->
    <g transform="translate(40, 32)">
      <text x="0" y="0" class="txt-title">Crear Cuenta de Turista</text>
      <text x="0" y="24" class="txt-muted">Registra tu usuario para guardar atractivos favoritos y armar tus rutas</text>
    </g>

    <!-- FORM FIELDS -->
    <g transform="translate(40, 85)">
      
      <!-- Field 1: Nombre Completo -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="txt-label">Nombre completo <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="440" height="40" class="input-box" />
        <text x="14" y="33" class="txt-placeholder">Ej. Francisca Valenzuela</text>
        <text x="0" y="60" class="txt-muted" font-size="10">Campo obligatorio para personalizar tu perfil de viajero</text>
      </g>

      <!-- Field 2: Correo Electrónico -->
      <g transform="translate(0, 75)">
        <text x="0" y="0" class="txt-label">Correo electrónico <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="440" height="40" class="input-box" />
        <text x="14" y="33" class="txt-placeholder">correo@ejemplo.com</text>
        <text x="0" y="60" class="txt-muted" font-size="10">Te enviaremos la confirmación de itinerarios a esta casilla</text>
      </g>

      <!-- Field 3: Contraseña con validación visual de seguridad (EP 1.3) -->
      <g transform="translate(0, 150)">
        <text x="0" y="0" class="txt-label">Contraseña <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="440" height="40" class="input-box" />
        <circle cx="20" cy="28" r="3" fill="#64748B" />
        <circle cx="28" cy="28" r="3" fill="#64748B" />
        <circle cx="36" cy="28" r="3" fill="#64748B" />
        <circle cx="44" cy="28" r="3" fill="#64748B" />
        <circle cx="52" cy="28" r="3" fill="#64748B" />
        <circle cx="60" cy="28" r="3" fill="#64748B" />

        <!-- Password Strength Meter (Requerido por EP 1.3) -->
        <g transform="translate(0, 56)">
          <text x="0" y="0" class="txt-muted" font-size="10">Seguridad: Media</text>
          <!-- 4 bars -->
          <rect x="110" y="-8" width="55" height="4" rx="2" fill="#16A34A" />
          <rect x="170" y="-8" width="55" height="4" rx="2" fill="#16A34A" />
          <rect x="230" y="-8" width="55" height="4" rx="2" fill="#E2E8F0" />
          <rect x="290" y="-8" width="55" height="4" rx="2" fill="#E2E8F0" />
        </g>
        <text x="0" y="74" class="txt-muted" font-size="10">Mínimo 8 caracteres, al menos una mayúscula y un número</text>
      </g>

      <!-- Field 4: Confirmar Contraseña (Muestra estado de validación / error) -->
      <g transform="translate(0, 245)">
        <text x="0" y="0" class="txt-label">Confirmar contraseña <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="440" height="40" class="input-box" />
        <circle cx="20" cy="28" r="3" fill="#64748B" />
        <circle cx="28" cy="28" r="3" fill="#64748B" />
        <circle cx="36" cy="28" r="3" fill="#64748B" />
        <circle cx="44" cy="28" r="3" fill="#64748B" />
        <circle cx="52" cy="28" r="3" fill="#64748B" />
        <circle cx="60" cy="28" r="3" fill="#64748B" />
        <!-- Check icon (Validador positivo) -->
        <circle cx="418" cy="28" r="8" fill="#DCFCE7" />
        <path d="M414 28 L417 31 L422 26" stroke="#16A34A" stroke-width="1.5" fill="none" />
      </g>

      <!-- Field 5: Preferencia de Viaje (Opcional - Requerimiento EP 1.3) -->
      <g transform="translate(0, 315)">
        <text x="0" y="0" class="txt-label">Tipo de turismo preferido <tspan fill="#64748B" font-weight="400">(Opcional)</tspan></text>
        <rect x="0" y="8" width="440" height="40" class="input-box" />
        <text x="14" y="33" class="txt-muted">Selecciona tu categoría de interés (ej. Parques / Montañas)</text>
        <polygon points="415,25 423,25 419,30" fill="#64748B" />
      </g>

      <!-- Checkbox: Términos y Condiciones (Obligatorio) -->
      <g transform="translate(0, 385)">
        <rect x="0" y="0" width="18" height="18" class="checkbox-checked" />
        <path d="M4 9 L7 12 L14 5" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="30" y="14" font-family="Inter, sans-serif" font-size="12" fill="#334155">
          He leído y acepto los <tspan fill="#2563EB" font-weight="600">Términos del Servicio</tspan> y la <tspan fill="#2563EB" font-weight="600">Política de Privacidad</tspan> <tspan fill="#EF4444">*</tspan>
        </text>
      </g>

      <!-- Submit Button -->
      <g transform="translate(0, 430)">
        <rect width="440" height="46" class="btn-primary" />
        <text x="220" y="28" class="btn-primary-txt">Crear mi cuenta de viajero</text>
      </g>

      <!-- Feedback / Login link -->
      <g transform="translate(0, 500)">
        <line x1="0" y1="0" x2="440" y2="0" stroke="#F1F5F9" stroke-width="1" />
        <text x="220" y="28" font-family="Inter, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
          ¿Ya tienes cuenta en Sendaria? <tspan fill="#0F172A" font-weight="700">Inicia sesión</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>

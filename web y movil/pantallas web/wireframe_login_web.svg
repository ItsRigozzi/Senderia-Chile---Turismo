<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .nav-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-auth { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 12px; }
      .input-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .input-box-active { fill: #FFFFFF; stroke: #0F172A; stroke-width: 1.5; rx: 6px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #0F172A; }
      .txt-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #334155; }
      .txt-input { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #0F172A; }
      .txt-placeholder { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #64748B; }
      .btn-primary { fill: #0F172A; rx: 6px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #FFFFFF; text-anchor: middle; }
      .badge-role { fill: #EEF2F6; rx: 4px; }
      .badge-role-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #475569; }
      .note-box { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" class="bg" />

  <!-- TOP NAVBAR -->
  <g id="Navbar">
    <rect width="1440" height="70" class="nav-bg" />
    <circle cx="50" cy="35" r="14" fill="#0F172A" />
    <path d="M44 38 L50 28 L56 38 Z" fill="#FFFFFF" />
    <text x="74" y="42" class="txt-brand">Sendaria <tspan fill="#64748B" font-weight="400">Chile</tspan></text>
    <text x="320" y="41" font-family="Inter, sans-serif" font-size="13" fill="#64748B">← Volver al portal turístico</text>
  </g>

  <!-- CENTER AUTH CARD CONTAINER (460px de ancho centrado) -->
  <g id="Login_Card" transform="translate(490, 130)">
    <rect width="460" height="640" class="card-auth" />

    <!-- Card Header -->
    <g transform="translate(40, 40)">
      <circle cx="20" cy="20" r="20" fill="#0F172A" />
      <path d="M12 25 L20 12 L28 25 Z" fill="#FFFFFF" />
      <text x="50" y="26" class="txt-title">Iniciar Sesión</text>
      <text x="0" y="58" class="txt-muted">Ingresa tus credenciales para acceder a la plataforma</text>
    </g>

    <!-- FORM FIELDS -->
    <g transform="translate(40, 135)">
      
      <!-- Field 1: Correo Electrónico -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="txt-label">Correo electrónico <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="10" width="380" height="44" class="input-box-active" />
        <circle cx="20" cy="32" r="6" stroke="#0F172A" stroke-width="1.5" fill="none" />
        <line x1="14" y1="28" x2="26" y2="36" stroke="#0F172A" stroke-width="1.5" />
        <text x="38" y="37" class="txt-input">admin@sendaria.cl</text>
        <text x="0" y="70" class="txt-muted" font-size="11">Formato válido: usuario@dominio.cl o .com</text>
      </g>

      <!-- Field 2: Contraseña -->
      <g transform="translate(0, 95)">
        <text x="0" y="0" class="txt-label">Contraseña <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="10" width="380" height="44" class="input-box" />
        <!-- Password mock dots -->
        <circle cx="20" cy="32" r="3" fill="#64748B" />
        <circle cx="28" cy="32" r="3" fill="#64748B" />
        <circle cx="36" cy="32" r="3" fill="#64748B" />
        <circle cx="44" cy="32" r="3" fill="#64748B" />
        <circle cx="52" cy="32" r="3" fill="#64748B" />
        <circle cx="60" cy="32" r="3" fill="#64748B" />
        <circle cx="68" cy="32" r="3" fill="#64748B" />
        <circle cx="76" cy="32" r="3" fill="#64748B" />
        <!-- Show password toggle icon -->
        <circle cx="355" cy="32" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
        <line x1="349" y1="38" x2="361" y2="26" stroke="#94A3B8" stroke-width="1.5" />
        
        <!-- Olvidé mi contraseña -->
        <text x="380" y="70" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#2563EB" text-anchor="end">¿Olvidaste tu contraseña?</text>
      </g>

      <!-- Botón de Inicio de Sesión (Submit) -->
      <g transform="translate(0, 195)">
        <rect width="380" height="46" class="btn-primary" />
        <text x="190" y="28" class="btn-primary-txt">Ingresar a Sendaria</text>
      </g>

      <!-- Info Box: Explicación de diferenciación de roles para la entrega -->
      <g transform="translate(0, 260)">
        <rect width="380" height="85" class="note-box" />
        <text x="14" y="22" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#0F172A">Diferenciación de roles del sistema:</text>
        <text x="14" y="42" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Correo de Turista: Acceso a itinerarios y Favoritos personales.</text>
        <text x="14" y="60" font-family="Inter, sans-serif" font-size="11" fill="#475569">• Correo institucional (admin@...): Redirección al Panel CMS.</text>
      </g>

      <!-- Link to Register -->
      <g transform="translate(0, 380)">
        <line x1="0" y1="0" x2="380" y2="0" stroke="#F1F5F9" stroke-width="1" />
        <text x="190" y="28" font-family="Inter, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">
          ¿No tienes una cuenta de turista? <tspan fill="#0F172A" font-weight="700">Regístrate aquí</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>

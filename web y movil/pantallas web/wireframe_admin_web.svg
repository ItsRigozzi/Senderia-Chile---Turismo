<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #F1F5F9; }
      .sidebar-bg { fill: #0F172A; }
      .nav-item-active { fill: #1E293B; rx: 6px; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 8px; }
      .table-header { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
      .table-row { fill: #FFFFFF; stroke: #F1F5F9; stroke-width: 1; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #FFFFFF; }
      .txt-nav { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #94A3B8; }
      .txt-nav-active { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; }
      .txt-header { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #0F172A; }
      .txt-stat-num { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 28px; fill: #0F172A; }
      .txt-stat-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #64748B; }
      .txt-cell-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1E293B; }
      .txt-cell-sub { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
      .txt-th { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #475569; }
      .btn-primary { fill: #0F172A; rx: 6px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .btn-secondary { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .btn-sec-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #334155; text-anchor: middle; }
      .badge-success { fill: #DCFCE7; rx: 12px; }
      .badge-success-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #15803D; text-anchor: middle; }
      .badge-cat { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; rx: 4px; }
      .badge-cat-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <!-- App Background -->
  <rect width="1440" height="900" class="bg" />

  <!-- LEFT ADMIN SIDEBAR (Width: 260px) -->
  <g id="Sidebar">
    <rect width="260" height="900" class="sidebar-bg" />
    
    <!-- Admin Brand Header -->
    <g transform="translate(24, 28)">
      <circle cx="14" cy="14" r="14" fill="#3B82F6" />
      <path d="M8 17 L14 7 L20 17 Z" fill="#FFFFFF" />
      <text x="36" y="20" class="txt-brand">Sendaria <tspan fill="#94A3B8" font-size="12" font-weight="400">ADMIN</tspan></text>
    </g>

    <!-- Navigation Section -->
    <g transform="translate(16, 90)">
      <text x="12" y="14" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="1">GESTIÓN TURÍSTICA</text>
      
      <!-- Nav Item 1: Destinos (Active) -->
      <g transform="translate(0, 30)">
        <rect width="228" height="40" class="nav-item-active" />
        <rect x="0" y="8" width="4" height="24" fill="#3B82F6" rx="2" />
        <circle cx="24" cy="20" r="5" fill="#60A5FA" />
        <text x="42" y="25" class="txt-nav-active">Destinos Turísticos</text>
        <rect x="180" y="11" width="34" height="18" rx="9" fill="#334155" />
        <text x="197" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#94A3B8" text-anchor="middle">48</text>
      </g>

      <!-- Nav Item 2: Categorias -->
      <g transform="translate(0, 78)">
        <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <text x="42" y="25" class="txt-nav">Categorías &amp; Tags</text>
      </g>

      <!-- Nav Item 3: Regiones -->
      <g transform="translate(0, 122)">
        <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <text x="42" y="25" class="txt-nav">Regiones &amp; Zonas</text>
      </g>

      <text x="12" y="195" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="1">SISTEMA &amp; LOGS</text>

      <!-- Nav Item 4: Moderacion -->
      <g transform="translate(0, 215)">
        <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <text x="42" y="25" class="txt-nav">Moderación Reseñas</text>
      </g>

      <!-- Nav Item 5: Usuarios -->
      <g transform="translate(0, 259)">
        <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <text x="42" y="25" class="txt-nav">Usuarios del Sistema</text>
      </g>
    </g>

    <!-- Bottom User Profile Footer -->
    <g transform="translate(20, 830)">
      <circle cx="20" cy="20" r="18" fill="#334155" />
      <text x="20" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">AD</text>
      <text x="50" y="18" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Admin Sernatur</text>
      <text x="50" y="32" font-family="Inter, sans-serif" font-size="11" fill="#64748B">editor@sendaria.cl</text>
    </g>
  </g>

  <!-- TOP HEADER (Width: 1180px, Height: 70px) -->
  <g id="Top_Header" transform="translate(260, 0)">
    <rect width="1180" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="40" y="42" class="txt-header">Panel de Control Turístico</text>

    <!-- Public View Shortcut Button -->
    <g transform="translate(860, 17)">
      <rect width="150" height="36" class="btn-secondary" />
      <text x="75" y="23" class="btn-sec-txt">↗ Ver Portal Público</text>
    </g>

    <!-- Add Destination CTA Button -->
    <g transform="translate(1025, 17)">
      <rect width="125" height="36" class="btn-primary" />
      <text x="62" y="23" class="btn-primary-txt">+ Nuevo Destino</text>
    </g>
  </g>

  <!-- MAIN BODY WORKSPACE (Width: 1180px) -->
  <g id="Admin_Workspace" transform="translate(260, 70)">
    
    <!-- STAT CARDS (ROW OF 3) -->
    <g id="Stat_Cards" transform="translate(40, 24)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="345" height="95" class="card" />
        <text x="20" y="34" class="txt-stat-label">Total Destinos Activos</text>
        <text x="20" y="74" class="txt-stat-num">48</text>
        <text x="75" y="72" font-family="Inter, sans-serif" font-size="12" fill="#16A34A">+3 este mes</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(375, 0)">
        <rect width="345" height="95" class="card" />
        <text x="20" y="34" class="txt-stat-label">Geolocalizados con Google Maps</text>
        <text x="20" y="74" class="txt-stat-num">100%</text>
        <text x="110" y="72" font-family="Inter, sans-serif" font-size="12" fill="#64748B">48 de 48 con Lat/Lng</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(750, 0)">
        <rect width="345" height="95" class="card" />
        <text x="20" y="34" class="txt-stat-label">Categorías Clasificadas</text>
        <text x="20" y="74" class="txt-stat-num">7</text>
        <text x="50" y="72" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Nivel nacional</text>
      </g>
    </g>

    <!-- DATA TABLE CONTAINER -->
    <g id="Table_Section" transform="translate(40, 140)">
      <rect width="1095" height="660" class="card" />

      <!-- Table Toolbar (Search + Filters inside table card) -->
      <g transform="translate(24, 20)">
        <!-- Table Search Input -->
        <rect width="320" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <circle cx="20" cy="19" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
        <line x1="24" y1="23" x2="30" y2="29" stroke="#94A3B8" stroke-width="1.5" />
        <text x="38" y="24" class="txt-muted" font-size="12">Filtrar por nombre o región...</text>

        <!-- Category Dropdown Filter -->
        <g transform="translate(340, 0)">
          <rect width="180" height="38" class="btn-secondary" />
          <text x="16" y="24" class="txt-main" font-size="12">Categoría: Todas</text>
          <polygon points="155,18 163,18 159,23" fill="#64748B" />
        </g>

        <!-- Status Filter -->
        <g transform="translate(535, 0)">
          <rect width="140" height="38" class="btn-secondary" />
          <text x="16" y="24" class="txt-main" font-size="12">Estado: Publicado</text>
          <polygon points="120,18 128,18 124,23" fill="#64748B" />
        </g>
      </g>

      <!-- TABLE HEADERS -->
      <g transform="translate(24, 76)">
        <rect width="1047" height="40" class="table-header" rx="4" />
        <text x="24" y="25" class="txt-th">DESTINO TURÍSTICO</text>
        <text x="340" y="25" class="txt-th">CATEGORÍA</text>
        <text x="480" y="25" class="txt-th">REGIÓN</text>
        <text x="680" y="25" class="txt-th">COORDENADAS (MAPA)</text>
        <text x="880" y="25" class="txt-th">ESTADO</text>
        <text x="980" y="25" class="txt-th">ACCIONES</text>
      </g>

      <!-- ROW 1 -->
      <g transform="translate(24, 126)">
        <rect width="1047" height="64" class="table-row" />
        <!-- Thumbnail -->
        <rect x="20" y="12" width="40" height="40" rx="4" fill="#E2E8F0" />
        <text x="72" y="28" class="txt-cell-title">Parque Nacional Torres del Paine</text>
        <text x="72" y="44" class="txt-cell-sub">ID: #DES-001 • Actualizado hace 2 días</text>

        <rect x="340" y="20" width="100" height="24" class="badge-cat" />
        <text x="350" y="36" class="badge-cat-txt">Parque Nacional</text>

        <text x="480" y="36" class="txt-cell-title">Magallanes</text>
        <text x="680" y="36" font-family="monospace" font-size="11" fill="#475569">-51.2532, -72.8814</text>

        <rect x="875" y="22" width="70" height="20" class="badge-success" />
        <text x="910" y="36" class="badge-success-txt">Activo</text>

        <text x="980" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
        <text x="1025" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
      </g>

      <!-- ROW 2 -->
      <g transform="translate(24, 198)">
        <rect width="1047" height="64" class="table-row" />
        <rect x="20" y="12" width="40" height="40" rx="4" fill="#E2E8F0" />
        <text x="72" y="28" class="txt-cell-title">Valle de la Luna</text>
        <text x="72" y="44" class="txt-cell-sub">ID: #DES-002 • San Pedro de Atacama</text>

        <rect x="340" y="20" width="70" height="24" class="badge-cat" />
        <text x="350" y="36" class="badge-cat-txt">Desierto</text>

        <text x="480" y="36" class="txt-cell-title">Antofagasta</text>
        <text x="680" y="36" font-family="monospace" font-size="11" fill="#475569">-22.9125, -68.2977</text>

        <rect x="875" y="22" width="70" height="20" class="badge-success" />
        <text x="910" y="36" class="badge-success-txt">Activo</text>

        <text x="980" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
        <text x="1025" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
      </g>

      <!-- ROW 3 -->
      <g transform="translate(24, 270)">
        <rect width="1047" height="64" class="table-row" />
        <rect x="20" y="12" width="40" height="40" rx="4" fill="#E2E8F0" />
        <text x="72" y="28" class="txt-cell-title">Cerros Alegre y Concepción</text>
        <text x="72" y="44" class="txt-cell-sub">ID: #DES-003 • Zona Típica &amp; Murales</text>

        <rect x="340" y="20" width="85" height="24" class="badge-cat" />
        <text x="350" y="36" class="badge-cat-txt">Patrimonio</text>

        <text x="480" y="36" class="txt-cell-title">Valparaíso</text>
        <text x="680" y="36" font-family="monospace" font-size="11" fill="#475569">-33.0428, -71.6288</text>

        <rect x="875" y="22" width="70" height="20" class="badge-success" />
        <text x="910" y="36" class="badge-success-txt">Activo</text>

        <text x="980" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
        <text x="1025" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
      </g>

      <!-- ROW 4 -->
      <g transform="translate(24, 342)">
        <rect width="1047" height="64" class="table-row" />
        <rect x="20" y="12" width="40" height="40" rx="4" fill="#E2E8F0" />
        <text x="72" y="28" class="txt-cell-title">Termas Geométricas</text>
        <text x="72" y="44" class="txt-cell-sub">ID: #DES-004 • Parque Nac. Villarrica</text>

        <rect x="340" y="20" width="65" height="24" class="badge-cat" />
        <text x="350" y="36" class="badge-cat-txt">Termas</text>

        <text x="480" y="36" class="txt-cell-title">Los Ríos / Araucanía</text>
        <text x="680" y="36" font-family="monospace" font-size="11" fill="#475569">-39.4981, -71.8683</text>

        <rect x="875" y="22" width="70" height="20" class="badge-success" />
        <text x="910" y="36" class="badge-success-txt">Activo</text>

        <text x="980" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
        <text x="1025" y="36" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
      </g>

      <!-- PAGINATION FOOTER -->
      <g transform="translate(24, 600)">
        <text x="0" y="20" class="txt-muted" font-size="12">Mostrando 1–4 de 48 destinos</text>
        <g transform="translate(850, 0)">
          <rect width="80" height="32" class="btn-secondary" />
          <text x="40" y="20" class="btn-sec-txt">Anterior</text>
          <rect x="90" y="0" width="80" height="32" class="btn-secondary" />
          <text x="130" y="20" class="btn-sec-txt">Siguiente</text>
        </g>
      </g>
    </g>
  </g>
</svg>

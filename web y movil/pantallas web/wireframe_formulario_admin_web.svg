<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #F1F5F9; }
      .sidebar-bg { fill: #0F172A; }
      .nav-item-active { fill: #1E293B; rx: 6px; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 8px; }
      .input-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #FFFFFF; }
      .txt-nav { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #94A3B8; }
      .txt-nav-active { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; }
      .txt-header { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #0F172A; }
      .txt-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #334155; }
      .txt-placeholder { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748B; }
      .btn-primary { fill: #0F172A; rx: 6px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .btn-secondary { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .btn-sec-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" class="bg" />

  <!-- LEFT ADMIN SIDEBAR -->
  <g id="Sidebar">
    <rect width="260" height="900" class="sidebar-bg" />
    
    <g transform="translate(24, 28)">
      <circle cx="14" cy="14" r="14" fill="#3B82F6" />
      <path d="M8 17 L14 7 L20 17 Z" fill="#FFFFFF" />
      <text x="36" y="20" class="txt-brand">Sendaria <tspan fill="#94A3B8" font-size="12" font-weight="400">ADMIN</tspan></text>
    </g>

    <g transform="translate(16, 90)">
      <text x="12" y="14" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="1">GESTIÓN TURÍSTICA</text>
      
      <!-- Nav Item 1: Destinos (Active) -->
      <g transform="translate(0, 30)">
        <rect width="228" height="40" class="nav-item-active" />
        <rect x="0" y="8" width="4" height="24" fill="#3B82F6" rx="2" />
        <circle cx="24" cy="20" r="5" fill="#60A5FA" />
        <text x="42" y="25" class="txt-nav-active">Destinos Turísticos</text>
      </g>

      <g transform="translate(0, 78)">
        <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <text x="42" y="25" class="txt-nav">Categorías &amp; Tags</text>
      </g>

      <g transform="translate(0, 122)">
        <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <text x="42" y="25" class="txt-nav">Regiones &amp; Zonas</text>
      </g>
    </g>

    <g transform="translate(20, 830)">
      <circle cx="20" cy="20" r="18" fill="#334155" />
      <text x="20" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0" text-anchor="middle">AD</text>
      <text x="50" y="18" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Admin Sernatur</text>
      <text x="50" y="32" font-family="Inter, sans-serif" font-size="11" fill="#64748B">editor@sendaria.cl</text>
    </g>
  </g>

  <!-- TOP HEADER -->
  <g id="Top_Header" transform="translate(260, 0)">
    <rect width="1180" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="40" y="42" class="txt-header">Registrar Nuevo Destino Turístico</text>
    <text x="420" y="42" class="txt-muted">Formulario oficial de carga de atractivos</text>

    <g transform="translate(1000, 17)">
      <rect width="140" height="36" class="btn-secondary" />
      <text x="70" y="23" class="btn-sec-txt">← Cancelar y Volver</text>
    </g>
  </g>

  <!-- MAIN FORM BODY (Grid 2 columnas dentro de una tarjeta de 1095px) -->
  <g id="Form_Workspace" transform="translate(300, 95)">
    <rect width="1095" height="765" class="card" />

    <!-- COLUMNA IZQUIERDA: Información General y Geográfica (510px) -->
    <g transform="translate(40, 30)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#0F172A">1. Información del Atractivo</text>
      
      <!-- Campo 1: Nombre -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" class="txt-label">Nombre oficial del destino <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="480" height="40" class="input-box" />
        <text x="14" y="33" class="txt-placeholder">Ej. Parque Nacional Alerce Costero</text>
      </g>

      <!-- Campo 2: Categoría y Región (Fila de 2) -->
      <g transform="translate(0, 90)">
        <!-- Categoría -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" class="txt-label">Categoría <tspan fill="#EF4444">*</tspan></text>
          <rect x="0" y="8" width="230" height="40" class="input-box" />
          <text x="14" y="33" class="txt-placeholder">Parque Nacional</text>
          <polygon points="210,25 218,25 214,30" fill="#64748B" />
        </g>
        <!-- Región -->
        <g transform="translate(250, 0)">
          <text x="0" y="0" class="txt-label">Región <tspan fill="#EF4444">*</tspan></text>
          <rect x="0" y="8" width="230" height="40" class="input-box" />
          <text x="14" y="33" class="txt-placeholder">Los Ríos</text>
          <polygon points="210,25 218,25 214,30" fill="#64748B" />
        </g>
      </g>

      <!-- Campo 3: Coordenadas GPS Google Maps (Requerimiento crítico de integración) -->
      <g transform="translate(0, 160)">
        <text x="0" y="0" class="txt-label">Geolocalización para Google Maps <tspan fill="#EF4444">*</tspan></text>
        <g transform="translate(0, 8)">
          <!-- Latitud -->
          <rect x="0" y="0" width="230" height="40" class="input-box" />
          <text x="14" y="25" class="txt-placeholder">Latitud: -40.1833</text>
          <!-- Longitud -->
          <rect x="250" y="0" width="230" height="40" class="input-box" />
          <text x="264" y="25" class="txt-placeholder">Longitud: -73.5167</text>
        </g>
        <text x="0" y="66" class="txt-muted">Punto geográfico exacto donde se renderizará el pin interactivo en la app.</text>
      </g>

      <!-- Campo 4: Descripción detallada -->
      <g transform="translate(0, 250)">
        <text x="0" y="0" class="txt-label">Descripción turística <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="480" height="110" class="input-box" />
        <text x="14" y="33" class="txt-placeholder">Describe el entorno natural, atractivos principales, flora y fauna protegida...</text>
      </g>

      <!-- Campo 5: Estado de Publicación -->
      <g transform="translate(0, 395)">
        <text x="0" y="0" class="txt-label">Estado de visibilidad en el portal</text>
        <g transform="translate(0, 10)">
          <circle cx="10" cy="10" r="8" fill="#16A34A" />
          <circle cx="10" cy="10" r="3" fill="#FFFFFF" />
          <text x="26" y="15" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#0F172A">Publicado inmediatamente (Visible para todos los turistas)</text>
        </g>
      </g>
    </g>

    <line x1="575" y1="30" x2="575" y2="690" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- COLUMNA DERECHA: Datos Prácticos y Galería de Fotos (480px) -->
    <g transform="translate(615, 30)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#0F172A">2. Datos de Operación y Multimedia</text>

      <!-- Zona de Carga de Imágenes (Drag & Drop) -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" class="txt-label">Fotografías del atractivo</text>
        <rect x="0" y="8" width="440" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4" />
        <circle cx="220" cy="50" r="18" fill="#E2E8F0" />
        <path d="M214 55 L220 44 L226 55 Z" fill="#64748B" />
        <text x="220" y="84" class="txt-main" font-size="12" text-anchor="middle">Arrastra fotos aquí o <tspan fill="#2563EB">examinar equipo</tspan></text>
        <text x="220" y="102" class="txt-muted" font-size="10" text-anchor="middle">JPG, PNG o WebP (Hasta 5MB por imagen)</text>
      </g>

      <!-- Horario y Costo -->
      <g transform="translate(0, 175)">
        <g transform="translate(0, 0)">
          <text x="0" y="0" class="txt-label">Horario de acceso público</text>
          <rect x="0" y="8" width="210" height="40" class="input-box" />
          <text x="14" y="33" class="txt-placeholder">Ej. 08:30 a 18:00 hrs</text>
        </g>
        <g transform="translate(230, 0)">
          <text x="0" y="0" class="txt-label">Tarifa de ingreso estimada</text>
          <rect x="0" y="8" width="210" height="40" class="input-box" />
          <text x="14" y="33" class="txt-placeholder">Ej. $5.000 CLP general</text>
        </g>
      </g>

      <!-- Temporada Recomendada -->
      <g transform="translate(0, 250)">
        <text x="0" y="0" class="txt-label">Temporada recomendada de visita</text>
        <rect x="0" y="8" width="440" height="40" class="input-box" />
        <text x="14" y="33" class="txt-placeholder">Ej. Diciembre a Marzo (Clima estival seco)</text>
      </g>

      <!-- Condiciones y Requisitos de Acceso -->
      <g transform="translate(0, 325)">
        <text x="0" y="0" class="txt-label">Condiciones de acceso y seguridad CONAF</text>
        <rect x="0" y="8" width="440" height="65" class="input-box" />
        <text x="14" y="33" class="txt-placeholder">Ej. Requiere registro obligatorio en portería, prohibido hacer fuego...</text>
      </g>

      <!-- BOTONES DE ACCIÓN (GUARDAR DESTINO) -->
      <g transform="translate(0, 430)">
        <line x1="0" y1="0" x2="440" y2="0" stroke="#F1F5F9" stroke-width="1" />
        
        <g transform="translate(180, 20)">
          <rect width="110" height="44" class="btn-secondary" />
          <text x="55" y="27" class="btn-sec-txt">Descartar</text>

          <rect x="120" y="0" width="140" height="44" class="btn-primary" />
          <text x="190" y="27" class="btn-primary-txt">Guardar Destino ✓</text>
        </g>
      </g>
    </g>
  </g>
</svg>

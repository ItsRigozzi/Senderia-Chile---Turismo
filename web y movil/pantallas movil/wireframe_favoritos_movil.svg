<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1340" width="390" height="1340">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-main { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #1E293B; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748B; }
      .badge { fill: #EEF2F6; rx: 4px; }
      .badge-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; fill: #475569; }
      .btn-outline { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 8px; }
      .btn-primary { fill: #0F172A; rx: 8px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .tab-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
    </style>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="1340" class="bg" />

  <!-- STATUS BAR (iOS Mock) -->
  <g id="Status_Bar">
    <text x="32" y="30" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#0F172A">9:41</text>
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000" />
    <circle cx="330" cy="26" r="3" fill="#0F172A" />
    <circle cx="340" cy="26" r="4" fill="#0F172A" />
    <rect x="350" y="20" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="352" y="22" width="12" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- TOP MOBILE HEADER -->
  <g id="Top_Header" transform="translate(0, 44)">
    <rect width="390" height="56" class="header-bg" />
    
    <!-- Title -->
    <text x="195" y="34" class="txt-brand" text-anchor="middle">Mis Favoritos</text>

    <!-- User Profile Avatar (Right) -->
    <g transform="translate(340, 10)">
      <circle cx="18" cy="18" r="16" fill="#E2E8F0" />
      <text x="18" y="22" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#475569" text-anchor="middle">FV</text>
    </g>
  </g>

  <!-- MAIN SCROLLABLE CONTENT -->
  <g id="Main_Content" transform="translate(16, 120)">
    
    <!-- Header Row -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="txt-title">Mis Atractivos Guardados</text>
      <text x="0" y="22" class="txt-muted">Colección de destinos guardados para tu</text>
      <text x="0" y="38" class="txt-muted">próximo itinerario de viaje en Chile</text>

      <!-- Action Buttons -->
      <g transform="translate(0, 60)">
        <rect width="174" height="42" class="btn-outline" />
        <text x="87" y="26" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#334155" text-anchor="middle">Compartir lista</text>
        
        <rect x="184" y="0" width="174" height="42" class="btn-primary" />
        <text x="271" y="26" class="btn-primary-txt">Ver en mapa 📍</text>
      </g>
    </g>

    <!-- GRID OF SAVED CARDS (Stacked) -->
    <g id="Favorites_List" transform="translate(0, 130)">
      
      <!-- CARD 1: Torres del Paine -->
      <g transform="translate(0, 0)">
        <rect width="358" height="295" class="card" />
        <!-- Thumbnail -->
        <rect x="12" y="12" width="334" height="150" rx="6" fill="#E2E8F0" />
        <path d="M 50 130 L 120 70 L 190 120 L 240 90 L 300 140" stroke="#94A3B8" stroke-width="2" fill="none" />
        <circle cx="120" cy="70" r="5" fill="#94A3B8" />
        
        <!-- Remove favorite button (Heart filled active) -->
        <circle cx="320" cy="36" r="14" fill="#FFFFFF" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" />
        <path d="M320 40 L315 35 A 3 3 0 0 1 320 31 A 3 3 0 0 1 325 35 Z" fill="#EF4444" />
        
        <!-- Info -->
        <rect x="16" y="174" width="105" height="20" class="badge" />
        <text x="22" y="188" class="badge-txt">PARQUE NACIONAL</text>
        <text x="16" y="214" class="txt-main" font-size="15">Torres del Paine</text>
        <text x="16" y="232" class="txt-muted">Magallanes y Antártica Chilena</text>
        <text x="16" y="250" class="txt-muted">★ 4.9 (1.4k) • Senderismo</text>

        <line x1="16" y1="266" x2="342" y2="266" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="284" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Ver detalles e itinerario →</text>
      </g>

      <!-- CARD 2: Valle de la Luna -->
      <g transform="translate(0, 315)">
        <rect width="358" height="295" class="card" />
        <!-- Thumbnail -->
        <rect x="12" y="12" width="334" height="150" rx="6" fill="#E2E8F0" />
        <path d="M 50 130 L 120 70 L 190 120 L 240 90 L 300 140" stroke="#94A3B8" stroke-width="2" fill="none" />
        <circle cx="320" cy="36" r="14" fill="#FFFFFF" />
        <path d="M320 40 L315 35 A 3 3 0 0 1 320 31 A 3 3 0 0 1 325 35 Z" fill="#EF4444" />
        
        <!-- Info -->
        <rect x="16" y="174" width="65" height="20" class="badge" />
        <text x="22" y="188" class="badge-txt">DESIERTO</text>
        <text x="16" y="214" class="txt-main" font-size="15">Valle de la Luna</text>
        <text x="16" y="232" class="txt-muted">San Pedro de Atacama</text>
        <text x="16" y="250" class="txt-muted">★ 4.8 (980) • Fotografía</text>

        <line x1="16" y1="266" x2="342" y2="266" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="284" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Ver detalles e itinerario →</text>
      </g>

      <!-- CARD 3: Cerros de Valparaiso -->
      <g transform="translate(0, 630)">
        <rect width="358" height="295" class="card" />
        <!-- Thumbnail -->
        <rect x="12" y="12" width="334" height="150" rx="6" fill="#E2E8F0" />
        <path d="M 50 130 L 120 70 L 190 120 L 240 90 L 300 140" stroke="#94A3B8" stroke-width="2" fill="none" />
        <circle cx="320" cy="36" r="14" fill="#FFFFFF" />
        <path d="M320 40 L315 35 A 3 3 0 0 1 320 31 A 3 3 0 0 1 325 35 Z" fill="#EF4444" />
        
        <!-- Info -->
        <rect x="16" y="174" width="85" height="20" class="badge" />
        <text x="22" y="188" class="badge-txt">PATRIMONIO</text>
        <text x="16" y="214" class="txt-main" font-size="15">Cerros de Valparaíso</text>
        <text x="16" y="232" class="txt-muted">Región de Valparaíso</text>
        <text x="16" y="250" class="txt-muted">★ 4.7 (2.1k) • Arte Urbano</text>

        <line x1="16" y1="266" x2="342" y2="266" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="284" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#0F172A">Ver detalles e itinerario →</text>
      </g>
    </g>

    <!-- Empty state mock helper -->
    <g transform="translate(0, 1070)">
      <rect width="358" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-dasharray="4 4" />
      <text x="179" y="45" class="txt-main" font-size="13" text-anchor="middle">¿Deseas agregar más lugares?</text>
      <text x="179" y="70" class="txt-muted" text-anchor="middle">Explora el mapa interactivo y presiona</text>
      <text x="179" y="88" class="txt-muted" text-anchor="middle">el ícono de corazón para guardar nuevos</text>
      <text x="179" y="106" class="txt-muted" text-anchor="middle">atractivos a tu colección.</text>
    </g>
  </g>

  <!-- BOTTOM TAB BAR (Fixed to bottom, Favoritos is active) -->
  <g id="Bottom_Tab_Bar" transform="translate(0, 1260)">
    <rect width="390" height="80" class="tab-bg" />
    
    <g transform="translate(30, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Explorar</text>
    </g>
    <g transform="translate(125, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Mapa</text>
    </g>
    
    <!-- Active Tab: Favoritos -->
    <g transform="translate(225, 10)">
      <path d="M20 20 L15 15 A 4 4 0 0 1 20 10 A 4 4 0 0 1 25 15 Z" fill="#0F172A" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#0F172A" text-anchor="middle">Favoritos</text>
    </g>
    
    <g transform="translate(320, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Perfil</text>
    </g>
    
    <!-- Home Indicator -->
    <rect x="130" y="65" width="130" height="4" rx="2" fill="#0F172A" />
  </g>
</svg>

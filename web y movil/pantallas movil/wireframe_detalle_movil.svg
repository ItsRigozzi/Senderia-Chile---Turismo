<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1150" width="390" height="1150">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .map-bg { fill: #E2E8F0; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #0F172A; }
      .txt-h2 { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #0F172A; }
      .txt-body { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #334155; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
      .txt-info-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; fill: #64748B; letter-spacing: 0.5px; }
      .txt-info-val { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #0F172A; }
      .badge { fill: #0F172A; rx: 4px; }
      .badge-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; fill: #FFFFFF; }
      .btn-primary { fill: #0F172A; rx: 8px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="1150" class="bg" />

  <!-- STATUS BAR (iOS Mock) -->
  <g id="Status_Bar">
    <text x="32" y="30" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#0F172A">9:41</text>
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000" />
    <circle cx="330" cy="26" r="3" fill="#0F172A" />
    <circle cx="340" cy="26" r="4" fill="#0F172A" />
    <rect x="350" y="20" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="352" y="22" width="12" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- TOP MOBILE HEADER -->
  <g id="Top_Header" transform="translate(0, 44)">
    <rect width="390" height="56" class="header-bg" />
    
    <!-- Back Button -->
    <path d="M 26 34 L 18 28 L 26 22" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Title -->
    <text x="195" y="34" class="txt-brand" text-anchor="middle">Detalle del Destino</text>

    <!-- Save Favorite (Heart Icon) -->
    <path d="M350,38 L341,29 A5.5,5.5 0 0,1 350,22 A5.5,5.5 0 0,1 359,29 Z" fill="none" stroke="#0F172A" stroke-width="1.5" />
  </g>

  <!-- SCROLLABLE CONTENT AREA -->
  
  <!-- Hero Image -->
  <g id="Hero_Image" transform="translate(16, 116)">
    <rect width="358" height="220" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 40 180 L 120 90 L 210 160 L 280 110 L 358 190" stroke="#94A3B8" stroke-width="2" fill="none" />
    <circle cx="120" cy="90" r="4" fill="#94A3B8" />
    <rect x="250" y="170" width="96" height="24" rx="12" fill="#0F172A" opacity="0.7" />
    <text x="298" y="186" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">📷 12 Fotos</text>
  </g>

  <!-- Header Info -->
  <g id="Header_Info" transform="translate(16, 356)">
    <rect x="0" y="0" width="120" height="20" class="badge" />
    <text x="8" y="14" class="badge-txt">PARQUE NACIONAL</text>
    
    <text x="0" y="44" class="txt-title">Parque Nacional</text>
    <text x="0" y="70" class="txt-title">Torres del Paine</text>
    
    <text x="0" y="94" class="txt-muted">Prov. de Última Esperanza, Magallanes</text>
    
    <!-- Rating -->
    <text x="0" y="118" font-family="Inter, sans-serif" font-size="14" fill="#F59E0B">★★★★★ <tspan fill="#0F172A" font-weight="600">4.9</tspan> <tspan fill="#64748B" font-size="12">(1.4k reseñas)</tspan></text>
  </g>

  <!-- Interactive Map Block -->
  <g id="Map_Block" transform="translate(16, 495)">
    <!-- Map Preview -->
    <rect width="358" height="130" rx="10" class="map-bg" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 0 50 Q 150 20 358 80" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-dasharray="4 4" />
    <path d="M 0 100 Q 200 60 358 120" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-dasharray="4 4" />
    
    <!-- Center Marker -->
    <g transform="translate(179, 65)">
      <ellipse cx="0" cy="14" rx="6" ry="3" fill="#000000" opacity="0.2" />
      <path d="M 0 -14 C -8 -14 -12 -8 -12 0 C -12 10 0 18 0 18 C 0 18 12 10 12 0 C 12 -8 8 -14 0 -14 Z" fill="#0F172A" />
      <circle cx="0" cy="-2" r="4" fill="#FFFFFF" />
    </g>

    <!-- Map Action Button -->
    <g transform="translate(0, 145)">
      <rect width="358" height="46" class="btn-primary" />
      <text x="179" y="28" class="btn-primary-txt">Abrir ruta en Google Maps ↗</text>
    </g>
  </g>

  <!-- Practical Info Card -->
  <g id="Practical_Info" transform="translate(16, 710)">
    <rect width="358" height="210" class="card" />
    <text x="20" y="30" class="txt-h2">Datos Prácticos de Visita</text>

    <!-- Item 1: Horarios -->
    <text x="20" y="60" class="txt-info-label">HORARIO DE ACCESO</text>
    <text x="20" y="76" class="txt-info-val">Lunes a Domingo: 07:00 – 20:30 hrs</text>

    <!-- Item 2: Tarifas -->
    <text x="20" y="104" class="txt-info-label">TARIFA DE ENTRADA ESTIMADA</text>
    <text x="20" y="120" class="txt-info-val">Nac: $8.000 CLP | Ext: $35 USD</text>

    <!-- Item 3: Temporada -->
    <text x="20" y="148" class="txt-info-label">TEMPORADA ÓPTIMA</text>
    <text x="20" y="164" class="txt-info-val">Octubre a Abril (Clima favorable)</text>

    <!-- Item 4: Condiciones -->
    <text x="20" y="192" class="txt-info-label">CONDICIONES DE ACCESO</text>
    <text x="20" y="192" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#334155" transform="translate(150, 0)">Reserva: pasesparques.cl</text>
  </g>

  <!-- Description Card -->
  <g id="Description" transform="translate(16, 935)">
    <rect width="358" height="120" class="card" />
    <text x="20" y="30" class="txt-h2">Acerca de este destino</text>
    <text x="20" y="54" class="txt-body">Considerado la octava maravilla del mundo, el</text>
    <text x="20" y="72" class="txt-body">Parque Nacional Torres del Paine es una de las</text>
    <text x="20" y="90" class="txt-body">áreas silvestres protegidas más importantes...</text>

    <line x1="0" y1="110" x2="358" y2="110" stroke="#F1F5F9" stroke-width="1" />
    
    <!-- Link to PDF -->
    <!-- Extended card height slightly to fit link -->
    <rect x="0" y="110" width="358" height="40" class="card" style="rx:0; stroke:none;" />
    <path d="M0 140 Q 0 150 10 150 L 348 150 Q 358 150 358 140 L 358 110 L 0 110 Z" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="179" y="135" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB" text-anchor="middle">Descargar guía de senderos (PDF) ↗</text>
  </g>

  <!-- BOTTOM TAB BAR (Fixed to the bottom of the viewport) -->
  <g id="Bottom_Tab_Bar" transform="translate(0, 1070)">
    <rect width="390" height="80" class="header-bg" />
    
    <g transform="translate(30, 10)">
      <circle cx="20" cy="14" r="7" fill="#0F172A" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#0F172A" text-anchor="middle">Explorar</text>
    </g>
    <g transform="translate(125, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Mapa</text>
    </g>
    <g transform="translate(225, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Favoritos</text>
    </g>
    <g transform="translate(320, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Perfil</text>
    </g>
    <rect x="130" y="65" width="130" height="4" rx="2" fill="#0F172A" />
  </g>
</svg>

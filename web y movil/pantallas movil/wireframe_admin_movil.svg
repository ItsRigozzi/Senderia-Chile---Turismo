<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1380" width="390" height="1380">
  <defs>
    <style>
      .bg { fill: #F1F5F9; }
      .header-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
      .txt-header { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748B; }
      .txt-stat-num { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #0F172A; }
      .txt-stat-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #64748B; }
      .txt-cell-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #1E293B; }
      .txt-cell-sub { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
      .btn-primary { fill: #0F172A; rx: 8px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .btn-secondary { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 8px; }
      .btn-sec-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #334155; text-anchor: middle; }
      .badge-success { fill: #DCFCE7; rx: 10px; }
      .badge-success-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; fill: #15803D; text-anchor: middle; }
      .badge-cat { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; rx: 4px; }
      .badge-cat-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="1380" class="bg" />

  <!-- STATUS BAR (iOS Mock) -->
  <g id="Status_Bar">
    <text x="32" y="30" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#0F172A">9:41</text>
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000" />
    <circle cx="330" cy="26" r="3" fill="#0F172A" />
    <circle cx="340" cy="26" r="4" fill="#0F172A" />
    <rect x="350" y="20" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="352" y="22" width="12" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- TOP MOBILE HEADER -->
  <g id="Top_Header" transform="translate(0, 44)">
    <rect width="390" height="56" class="header-bg" />
    
    <!-- Hamburger Menu Icon -->
    <line x1="20" y1="22" x2="40" y2="22" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="28" x2="40" y2="28" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="34" x2="32" y2="34" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Centered Brand -->
    <text x="195" y="34" class="txt-brand" text-anchor="middle">Sendaria <tspan fill="#64748B" font-size="12" font-weight="400">ADMIN</tspan></text>

    <!-- User Profile Avatar (Right) -->
    <g transform="translate(334, 10)">
      <circle cx="18" cy="18" r="16" fill="#334155" />
      <text x="18" y="22" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#E2E8F0" text-anchor="middle">AD</text>
    </g>
  </g>

  <!-- PAGE HEADER & CTA -->
  <g id="Page_Header" transform="translate(16, 120)">
    <text x="0" y="0" class="txt-header">Gestión de Destinos</text>
    <text x="0" y="20" class="txt-muted">Administra los atractivos de la plataforma</text>
    
    <!-- Main CTA -->
    <g transform="translate(0, 40)">
      <rect width="358" height="42" class="btn-primary" />
      <text x="179" y="26" class="btn-primary-txt">+ Nuevo Destino Turístico</text>
    </g>
  </g>

  <!-- STAT CARDS (Stacked horizontally on scroll, but for wireframe we show 2 in a grid) -->
  <g id="Stat_Cards" transform="translate(16, 220)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="174" height="85" class="card" />
      <text x="12" y="26" class="txt-stat-label">Destinos Activos</text>
      <text x="12" y="60" class="txt-stat-num">48</text>
      <text x="12" y="74" font-family="Inter, sans-serif" font-size="10" fill="#16A34A">+3 este mes</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(184, 0)">
      <rect width="174" height="85" class="card" />
      <text x="12" y="26" class="txt-stat-label">Con Google Maps</text>
      <text x="12" y="60" class="txt-stat-num">100%</text>
      <text x="12" y="74" font-family="Inter, sans-serif" font-size="10" fill="#64748B">48 de 48 geoloc.</text>
    </g>
  </g>

  <!-- SEARCH & FILTERS -->
  <g id="Filters" transform="translate(16, 325)">
    <!-- Search Box -->
    <rect width="358" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="20" cy="21" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
    <line x1="24" y1="25" x2="30" y2="31" stroke="#94A3B8" stroke-width="1.5" />
    <text x="38" y="26" class="txt-muted">Buscar destino o ID...</text>

    <!-- Filters Row -->
    <g transform="translate(0, 52)">
      <rect width="174" height="38" class="btn-secondary" />
      <text x="12" y="24" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#334155">Categoría</text>
      <polygon points="150,17 158,17 154,22" fill="#64748B" />

      <rect x="184" y="0" width="174" height="38" class="btn-secondary" />
      <text x="196" y="24" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#334155">Estado</text>
      <polygon points="334,17 342,17 338,22" fill="#64748B" />
    </g>
  </g>

  <!-- DESTINATIONS LIST (Card format replacing desktop table) -->
  <g id="Destinations_List" transform="translate(16, 440)">
    
    <!-- CARD 1 -->
    <g transform="translate(0, 0)">
      <rect width="358" height="145" class="card" />
      <rect x="12" y="12" width="46" height="46" rx="6" fill="#E2E8F0" />
      <text x="70" y="26" class="txt-cell-title">P. Nac. Torres del Paine</text>
      <text x="70" y="44" class="txt-cell-sub">#DES-001 • Magallanes</text>
      
      <!-- Status Badge -->
      <rect x="290" y="12" width="56" height="20" class="badge-success" />
      <text x="318" y="26" class="badge-success-txt">Activo</text>

      <!-- Category & Coords -->
      <rect x="12" y="72" width="100" height="22" class="badge-cat" />
      <text x="62" y="87" class="badge-cat-txt">Parque Nacional</text>
      <text x="120" y="87" font-family="monospace" font-size="11" fill="#475569">Lat: -51.25, Lng: -72.88</text>

      <line x1="12" y1="105" x2="346" y2="105" stroke="#F1F5F9" />

      <!-- Actions -->
      <text x="230" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
      <text x="295" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
    </g>

    <!-- CARD 2 -->
    <g transform="translate(0, 160)">
      <rect width="358" height="145" class="card" />
      <rect x="12" y="12" width="46" height="46" rx="6" fill="#E2E8F0" />
      <text x="70" y="26" class="txt-cell-title">Valle de la Luna</text>
      <text x="70" y="44" class="txt-cell-sub">#DES-002 • Antofagasta</text>
      
      <rect x="290" y="12" width="56" height="20" class="badge-success" />
      <text x="318" y="26" class="badge-success-txt">Activo</text>

      <rect x="12" y="72" width="70" height="22" class="badge-cat" />
      <text x="47" y="87" class="badge-cat-txt">Desierto</text>
      <text x="90" y="87" font-family="monospace" font-size="11" fill="#475569">Lat: -22.91, Lng: -68.29</text>

      <line x1="12" y1="105" x2="346" y2="105" stroke="#F1F5F9" />

      <text x="230" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
      <text x="295" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
    </g>

    <!-- CARD 3 -->
    <g transform="translate(0, 320)">
      <rect width="358" height="145" class="card" />
      <rect x="12" y="12" width="46" height="46" rx="6" fill="#E2E8F0" />
      <text x="70" y="26" class="txt-cell-title">Cerros Valparaíso</text>
      <text x="70" y="44" class="txt-cell-sub">#DES-003 • Valparaíso</text>
      
      <rect x="290" y="12" width="56" height="20" class="badge-success" />
      <text x="318" y="26" class="badge-success-txt">Activo</text>

      <rect x="12" y="72" width="75" height="22" class="badge-cat" />
      <text x="49" y="87" class="badge-cat-txt">Patrimonio</text>
      <text x="95" y="87" font-family="monospace" font-size="11" fill="#475569">Lat: -33.04, Lng: -71.62</text>

      <line x1="12" y1="105" x2="346" y2="105" stroke="#F1F5F9" />

      <text x="230" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
      <text x="295" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
    </g>

    <!-- CARD 4 -->
    <g transform="translate(0, 480)">
      <rect width="358" height="145" class="card" />
      <rect x="12" y="12" width="46" height="46" rx="6" fill="#E2E8F0" />
      <text x="70" y="26" class="txt-cell-title">Termas Geométricas</text>
      <text x="70" y="44" class="txt-cell-sub">#DES-004 • Los Ríos</text>
      
      <rect x="290" y="12" width="56" height="20" class="badge-success" />
      <text x="318" y="26" class="badge-success-txt">Activo</text>

      <rect x="12" y="72" width="60" height="22" class="badge-cat" />
      <text x="42" y="87" class="badge-cat-txt">Termas</text>
      <text x="80" y="87" font-family="monospace" font-size="11" fill="#475569">Lat: -39.49, Lng: -71.86</text>

      <line x1="12" y1="105" x2="346" y2="105" stroke="#F1F5F9" />

      <text x="230" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB">Editar</text>
      <text x="295" y="128" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#EF4444">Eliminar</text>
    </g>
  </g>

  <!-- PAGINATION CONTROLS -->
  <g id="Pagination" transform="translate(16, 1085)">
    <text x="179" y="0" class="txt-muted" text-anchor="middle">Mostrando 1–4 de 48 destinos</text>
    
    <g transform="translate(0, 20)">
      <rect width="174" height="42" class="btn-secondary" />
      <text x="87" y="26" class="btn-sec-txt">Anterior</text>

      <rect x="184" y="0" width="174" height="42" class="btn-secondary" />
      <text x="271" y="26" class="btn-sec-txt">Siguiente</text>
    </g>
  </g>

  <!-- BOTTOM PORTAL SHORTCUT (Sticky helper for Admin) -->
  <g transform="translate(16, 1310)">
    <rect width="358" height="40" rx="8" fill="#E2E8F0" />
    <text x="179" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#334155" text-anchor="middle">↗ Ir al Portal Público</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1450" width="390" height="1450">
  <defs>
    <style>
      .bg { fill: #F1F5F9; }
      .header-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .input-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
      .txt-header { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-section { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #0F172A; }
      .txt-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #334155; }
      .txt-placeholder { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
      .btn-primary { fill: #0F172A; rx: 8px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #FFFFFF; text-anchor: middle; }
      .btn-secondary { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 8px; }
      .btn-sec-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="1450" class="bg" />

  <!-- STATUS BAR (iOS Mock) -->
  <g id="Status_Bar">
    <text x="32" y="30" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#0F172A">9:41</text>
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000" />
    <circle cx="330" cy="26" r="3" fill="#0F172A" />
    <circle cx="340" cy="26" r="4" fill="#0F172A" />
    <rect x="350" y="20" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="352" y="22" width="12" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- TOP MOBILE HEADER (Replaces Desktop Sidebar) -->
  <g id="Top_Header" transform="translate(0, 44)">
    <rect width="390" height="56" class="header-bg" />
    
    <!-- Hamburger Menu Icon -->
    <line x1="20" y1="22" x2="40" y2="22" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="28" x2="40" y2="28" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="34" x2="32" y2="34" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Centered Brand -->
    <text x="195" y="34" class="txt-brand" text-anchor="middle">Sendaria <tspan fill="#64748B" font-size="12" font-weight="400">ADMIN</tspan></text>

    <!-- User Profile Avatar (Right) -->
    <g transform="translate(334, 10)">
      <circle cx="18" cy="18" r="16" fill="#334155" />
      <text x="18" y="22" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#E2E8F0" text-anchor="middle">AD</text>
    </g>
  </g>

  <!-- PAGE HEADER & BACK BUTTON -->
  <g id="Page_Header" transform="translate(16, 120)">
    <text x="0" y="0" class="txt-header">Registrar Nuevo Destino</text>
    <text x="0" y="20" class="txt-muted">Formulario oficial de carga de atractivos</text>
    
    <g transform="translate(0, 36)">
      <rect width="160" height="36" class="btn-secondary" />
      <text x="80" y="23" class="btn-sec-txt">← Cancelar y Volver</text>
    </g>
  </g>

  <!-- MAIN FORM WORKSPACE -->
  <g id="Form_Workspace" transform="translate(16, 215)">
    <!-- Main Card spanning most of the height -->
    <rect width="358" height="1190" class="card" />

    <g transform="translate(20, 24)">
      
      <!-- ============================================== -->
      <!-- SECTION 1: Información del Atractivo           -->
      <!-- ============================================== -->
      <text x="0" y="0" class="txt-section">1. Información del Atractivo</text>
      
      <!-- Campo 1: Nombre -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" class="txt-label">Nombre oficial del destino <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="318" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Ej. Parque Nacional Alerce Costero</text>
      </g>

      <!-- Campo 2: Categoría -->
      <g transform="translate(0, 100)">
        <text x="0" y="0" class="txt-label">Categoría <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="318" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Parque Nacional</text>
        <polygon points="295,25 303,25 299,30" fill="#64748B" />
      </g>

      <!-- Campo 3: Región -->
      <g transform="translate(0, 170)">
        <text x="0" y="0" class="txt-label">Región <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="318" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Los Ríos</text>
        <polygon points="295,25 303,25 299,30" fill="#64748B" />
      </g>

      <!-- Campo 4: Geolocalización (Split view in mobile) -->
      <g transform="translate(0, 240)">
        <text x="0" y="0" class="txt-label">Geolocalización para Google Maps <tspan fill="#EF4444">*</tspan></text>
        
        <!-- Latitud -->
        <rect x="0" y="8" width="154" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Lat: -40.1833</text>
        
        <!-- Longitud -->
        <rect x="164" y="8" width="154" height="40" class="input-box" />
        <text x="176" y="33" class="txt-placeholder">Lng: -73.5167</text>
        
        <text x="0" y="66" class="txt-muted">Punto geográfico donde se renderizará</text>
        <text x="0" y="82" class="txt-muted">el pin interactivo en la app.</text>
      </g>

      <!-- Campo 5: Descripción -->
      <g transform="translate(0, 345)">
        <text x="0" y="0" class="txt-label">Descripción turística <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="8" width="318" height="90" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Describe el entorno natural, atractivos...</text>
      </g>

      <!-- Campo 6: Estado de Publicación -->
      <g transform="translate(0, 465)">
        <text x="0" y="0" class="txt-label">Estado de visibilidad</text>
        <g transform="translate(0, 14)">
          <circle cx="10" cy="10" r="8" fill="#16A34A" />
          <circle cx="10" cy="10" r="3" fill="#FFFFFF" />
          <!-- Wrapped text -->
          <text x="26" y="10" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#0F172A">Publicado inmediatamente</text>
          <text x="26" y="24" class="txt-muted">(Visible para todos los turistas)</text>
        </g>
      </g>

      <!-- Divisor -->
      <line x1="0" y1="535" x2="318" y2="535" stroke="#F1F5F9" stroke-width="2" />

      <!-- ============================================== -->
      <!-- SECTION 2: Datos de Operación y Multimedia     -->
      <!-- ============================================== -->
      <text x="0" y="575" class="txt-section">2. Operación y Multimedia</text>

      <!-- Zona de Carga de Imágenes -->
      <g transform="translate(0, 605)">
        <text x="0" y="0" class="txt-label">Fotografías del atractivo</text>
        <rect x="0" y="8" width="318" height="120" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4" />
        <circle cx="159" cy="50" r="18" fill="#E2E8F0" />
        <path d="M153 55 L159 44 L165 55 Z" fill="#64748B" />
        <text x="159" y="84" class="txt-label" font-size="11" text-anchor="middle">Sube fotos aquí o <tspan fill="#2563EB">examinar equipo</tspan></text>
        <text x="159" y="102" class="txt-muted" font-size="10" text-anchor="middle">JPG, PNG o WebP (Hasta 5MB/img)</text>
      </g>

      <!-- Horario -->
      <g transform="translate(0, 755)">
        <text x="0" y="0" class="txt-label">Horario de acceso público</text>
        <rect x="0" y="8" width="318" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Ej. 08:30 a 18:00 hrs</text>
      </g>

      <!-- Tarifa -->
      <g transform="translate(0, 825)">
        <text x="0" y="0" class="txt-label">Tarifa de ingreso estimada</text>
        <rect x="0" y="8" width="318" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Ej. $5.000 CLP general</text>
      </g>

      <!-- Temporada -->
      <g transform="translate(0, 895)">
        <text x="0" y="0" class="txt-label">Temporada recomendada de visita</text>
        <rect x="0" y="8" width="318" height="40" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Ej. Diciembre a Marzo</text>
      </g>

      <!-- Condiciones -->
      <g transform="translate(0, 965)">
        <text x="0" y="0" class="txt-label">Condiciones de acceso (CONAF)</text>
        <rect x="0" y="8" width="318" height="70" class="input-box" />
        <text x="12" y="33" class="txt-placeholder">Ej. Registro obligatorio en portería...</text>
      </g>

      <!-- Divisor -->
      <line x1="0" y1="1075" x2="318" y2="1075" stroke="#F1F5F9" stroke-width="2" />

      <!-- BOTONES DE ACCIÓN (Descartar / Guardar) -->
      <g transform="translate(0, 1105)">
        <rect x="0" y="0" width="154" height="46" class="btn-secondary" />
        <text x="77" y="28" class="btn-sec-txt">Descartar</text>

        <rect x="164" y="0" width="154" height="46" class="btn-primary" />
        <text x="241" y="28" class="btn-primary-txt">Guardar Destino ✓</text>
      </g>
      
    </g>
  </g>
</svg>

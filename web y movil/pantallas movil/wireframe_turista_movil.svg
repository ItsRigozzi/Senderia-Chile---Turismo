<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .map-bg { fill: #E2E8F0; }
      .map-road { stroke: #CBD5E1; stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
      .txt-main { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1E293B; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; fill: #0F172A; }
      .chip-active-bg { fill: #0F172A; rx: 14px; }
      .chip-active-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #FFFFFF; }
      .chip-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 14px; }
      .txt-chip { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #334155; }
      .badge { fill: #EEF2F6; rx: 4px; }
      .badge-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 9px; fill: #475569; }
      .nav-bar-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
    </style>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="844" class="bg" />

  <!-- STATUS BAR (iOS Mock) -->
  <g id="Status_Bar">
    <text x="32" y="30" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#0F172A">9:41</text>
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000" />
    <circle cx="330" cy="26" r="3" fill="#0F172A" />
    <circle cx="340" cy="26" r="4" fill="#0F172A" />
    <rect x="350" y="20" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="352" y="22" width="12" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- TOP MOBILE HEADER -->
  <g id="Top_Header" transform="translate(0, 44)">
    <rect width="390" height="56" class="header-bg" />
    <circle cx="34" cy="28" r="12" fill="#0F172A" />
    <path d="M29 31 L34 22 L39 31 Z" fill="#FFFFFF" />
    <text x="54" y="33" class="txt-brand">Sendaria <tspan fill="#64748B" font-weight="400">Chile</tspan></text>
    
    <!-- Admin Shortcut -->
    <g transform="translate(335, 14)">
      <circle cx="15" cy="14" r="14" fill="#F1F5F9" stroke="#E2E8F0" />
      <text x="15" y="18" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">ADM</text>
    </g>
  </g>

  <!-- SEARCH BAR -->
  <g id="Search_Bar" transform="translate(16, 110)">
    <rect width="358" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="22" cy="21" r="5.5" stroke="#64748B" stroke-width="1.5" fill="none" />
    <line x1="26" y1="25" x2="32" y2="31" stroke="#64748B" stroke-width="1.5" />
    <text x="40" y="25" class="txt-muted" font-size="12">Buscar destino, región o parque...</text>
  </g>

  <!-- CATEGORIES -->
  <g id="Categories_Chips" transform="translate(16, 162)">
    <rect x="0" y="0" width="60" height="28" class="chip-active-bg" />
    <text x="30" y="18" class="chip-active-txt" text-anchor="middle">Todos</text>
    <rect x="68" y="0" width="95" height="28" class="chip-bg" />
    <text x="115" y="18" class="txt-chip" text-anchor="middle">Parques Nac.</text>
    <rect x="171" y="0" width="75" height="28" class="chip-bg" />
    <text x="208" y="18" class="txt-chip" text-anchor="middle">Montañas</text>
    <rect x="254" y="0" width="65" height="28" class="chip-bg" />
    <text x="286" y="18" class="txt-chip" text-anchor="middle">Playas</text>
    <rect x="327" y="0" width="65" height="28" class="chip-bg" />
    <text x="359" y="18" class="txt-chip" text-anchor="middle">Termas</text>
  </g>

  <!-- MINI MAP SECTION -->
  <g id="Map_Section" transform="translate(16, 202)">
    <rect width="358" height="150" rx="10" class="map-bg" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 40 0 Q 100 60 160 150" class="map-road" />
    <path d="M 200 0 Q 240 80 320 150" class="map-road" />
    <path d="M 0 80 Q 150 70 358 110" class="map-road" />

    <g transform="translate(140, 65)">
      <ellipse cx="0" cy="12" rx="5" ry="2.5" fill="#000000" opacity="0.2" />
      <path d="M 0 -12 C -7 -12 -11 -7 -11 0 C -11 8 0 16 0 16 C 0 16 11 8 11 0 C 11 -7 7 -12 0 -12 Z" fill="#0F172A" />
      <circle cx="0" cy="-2" r="3" fill="#FFFFFF" />
    </g>

    <g transform="translate(240, 95)">
      <ellipse cx="0" cy="10" rx="4" ry="2" fill="#000000" opacity="0.2" />
      <path d="M 0 -10 C -6 -10 -9 -6 -9 0 C -9 7 0 14 0 14 C 0 14 9 7 9 0 C 9 -6 6 -10 0 -10 Z" fill="#64748B" />
      <circle cx="0" cy="-2" r="2.5" fill="#FFFFFF" />
    </g>

    <rect x="12" y="12" width="135" height="24" rx="4" fill="#FFFFFF" opacity="0.95" />
    <text x="20" y="28" class="txt-main" font-size="10">● 48 Atractivos activos</text>
  </g>

  <!-- DESTINATIONS LIST HEADER -->
  <g transform="translate(16, 372)">
    <text x="0" y="0" class="txt-title">Destinos populares</text>
    <text x="358" y="0" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#2563EB" text-anchor="end">Ver todos (48)</text>
  </g>

  <!-- DESTINATION CARDS -->
  <!-- CARD 1 -->
  <g id="Card_Torres_Paine" transform="translate(16, 386)">
    <rect width="358" height="110" class="card-bg" />
    <rect x="10" y="10" width="90" height="90" rx="8" fill="#E2E8F0" />
    <path d="M 30 75 L 50 45 L 70 70 L 80 58 L 95 80" stroke="#94A3B8" stroke-width="1.5" fill="none" />
    <rect x="112" y="12" width="80" height="16" class="badge" />
    <text x="120" y="24" class="badge-txt">PARQUE NACIONAL</text>
    <text x="112" y="44" class="txt-main" font-size="14">Torres del Paine</text>
    <text x="112" y="60" class="txt-muted">Magallanes • ★ 4.9 (1.4k)</text>
    <rect x="112" y="74" width="130" height="26" rx="5" fill="#0F172A" />
    <text x="177" y="91" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">Ver itinerario ➔</text>
  </g>

  <!-- CARD 2 -->
  <g id="Card_Valle_Luna" transform="translate(16, 508)">
    <rect width="358" height="110" class="card-bg" />
    <rect x="10" y="10" width="90" height="90" rx="8" fill="#E2E8F0" />
    <path d="M 30 75 L 50 45 L 70 70 L 80 58 L 95 80" stroke="#94A3B8" stroke-width="1.5" fill="none" />
    <rect x="112" y="12" width="60" height="16" class="badge" />
    <text x="120" y="24" class="badge-txt">DESIERTO</text>
    <text x="112" y="44" class="txt-main" font-size="14">Valle de la Luna</text>
    <text x="112" y="60" class="txt-muted">San Pedro de Atacama • ★ 4.8</text>
    <rect x="112" y="74" width="130" height="26" rx="5" fill="#0F172A" />
    <text x="177" y="91" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">Ver itinerario ➔</text>
  </g>

  <!-- CARD 3 -->
  <g id="Card_Valparaiso" transform="translate(16, 630)">
    <rect width="358" height="110" class="card-bg" />
    <rect x="10" y="10" width="90" height="90" rx="8" fill="#E2E8F0" />
    <rect x="112" y="12" width="70" height="16" class="badge" />
    <text x="120" y="24" class="badge-txt">PATRIMONIO</text>
    <text x="112" y="44" class="txt-main" font-size="14">Cerros de Valparaíso</text>
    <text x="112" y="60" class="txt-muted">Región Valparaíso • ★ 4.7</text>
    <rect x="112" y="74" width="130" height="26" rx="5" fill="#0F172A" />
    <text x="177" y="91" font-family="Inter, sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">Ver itinerario ➔</text>
  </g>

  <!-- BOTTOM TAB BAR -->
  <g id="Bottom_Tab_Bar" transform="translate(0, 764)">
    <rect width="390" height="80" class="nav-bar-bg" />
    
    <g transform="translate(30, 10)">
      <circle cx="20" cy="14" r="7" fill="#0F172A" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#0F172A" text-anchor="middle">Explorar</text>
    </g>
    <g transform="translate(125, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Mapa</text>
    </g>
    <g transform="translate(225, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Favoritos</text>
    </g>
    <g transform="translate(320, 10)">
      <circle cx="20" cy="14" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">Perfil</text>
    </g>
    <rect x="130" y="65" width="130" height="4" rx="2" fill="#0F172A" />
  </g>
</svg>

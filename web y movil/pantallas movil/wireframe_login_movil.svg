<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .header-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-auth { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 12px; }
      .input-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .input-box-active { fill: #FFFFFF; stroke: #0F172A; stroke-width: 1.5; rx: 6px; }
      .txt-brand { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #0F172A; }
      .txt-title { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #0F172A; }
      .txt-label { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #334155; }
      .txt-input { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #0F172A; }
      .txt-muted { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
      .btn-primary { fill: #0F172A; rx: 6px; }
      .btn-primary-txt { font-family: Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #FFFFFF; text-anchor: middle; }
      .note-box { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="390" height="844" class="bg" />

  <!-- STATUS BAR (iOS Mock) -->
  <g id="Status_Bar">
    <text x="32" y="30" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#0F172A">9:41</text>
    <rect x="135" y="10" width="120" height="28" rx="14" fill="#000000" />
    <circle cx="330" cy="26" r="3" fill="#0F172A" />
    <circle cx="340" cy="26" r="4" fill="#0F172A" />
    <rect x="350" y="20" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="352" y="22" width="12" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- TOP MOBILE HEADER -->
  <g id="Top_Header" transform="translate(0, 44)">
    <rect width="390" height="56" class="header-bg" />
    <!-- Back Button -->
    <path d="M 24 28 L 32 20 L 32 36 Z" fill="#64748B" />
    
    <!-- Centered Brand -->
    <g transform="translate(130, 0)">
      <circle cx="10" cy="28" r="12" fill="#0F172A" />
      <path d="M 5 31 L 10 22 L 15 31 Z" fill="#FFFFFF" />
      <text x="30" y="33" class="txt-brand">Sendaria <tspan fill="#64748B" font-weight="400">Chile</tspan></text>
    </g>
  </g>

  <!-- CENTER AUTH CARD CONTAINER -->
  <g id="Login_Card" transform="translate(16, 116)">
    <rect width="358" height="550" class="card-auth" />

    <!-- Card Header -->
    <g transform="translate(20, 30)">
      <circle cx="16" cy="16" r="16" fill="#0F172A" />
      <path d="M10 20 L16 10 L22 20 Z" fill="#FFFFFF" />
      <text x="42" y="22" class="txt-title">Iniciar Sesión</text>
      <!-- Texto descriptivo envuelto para pantallas estrechas -->
      <text x="0" y="52" class="txt-muted">Ingresa tus credenciales para acceder</text>
      <text x="0" y="68" class="txt-muted">a la plataforma</text>
    </g>

    <!-- FORM FIELDS (Ancho ajustado a 318px) -->
    <g transform="translate(20, 120)">
      
      <!-- Field 1: Correo Electrónico (Activo) -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="txt-label">Correo electrónico <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="10" width="318" height="44" class="input-box-active" />
        <circle cx="20" cy="32" r="6" stroke="#0F172A" stroke-width="1.5" fill="none" />
        <line x1="14" y1="28" x2="26" y2="36" stroke="#0F172A" stroke-width="1.5" />
        <text x="38" y="37" class="txt-input">admin@sendaria.cl</text>
        <text x="0" y="70" class="txt-muted" font-size="10">Formato válido: usuario@dominio.cl o .com</text>
      </g>

      <!-- Field 2: Contraseña -->
      <g transform="translate(0, 95)">
        <text x="0" y="0" class="txt-label">Contraseña <tspan fill="#EF4444">*</tspan></text>
        <rect x="0" y="10" width="318" height="44" class="input-box" />
        <!-- Mock Password Dots -->
        <circle cx="20" cy="32" r="3" fill="#64748B" />
        <circle cx="28" cy="32" r="3" fill="#64748B" />
        <circle cx="36" cy="32" r="3" fill="#64748B" />
        <circle cx="44" cy="32" r="3" fill="#64748B" />
        <circle cx="52" cy="32" r="3" fill="#64748B" />
        <circle cx="60" cy="32" r="3" fill="#64748B" />
        <circle cx="68" cy="32" r="3" fill="#64748B" />
        <!-- Toggle visibility icon adjusted for mobile width -->
        <circle cx="290" cy="32" r="6" stroke="#94A3B8" stroke-width="1.5" fill="none" />
        <line x1="284" y1="38" x2="296" y2="26" stroke="#94A3B8" stroke-width="1.5" />
        
        <!-- Olvidé mi contraseña alineado a la derecha de la caja -->
        <text x="318" y="72" font-family="Inter, sans-serif" font-weight="500" font-size="11" fill="#2563EB" text-anchor="end">¿Olvidaste tu contraseña?</text>
      </g>

      <!-- Botón de Inicio de Sesión -->
      <g transform="translate(0, 195)">
        <rect width="318" height="46" class="btn-primary" />
        <text x="159" y="28" class="btn-primary-txt">Ingresar a Sendaria</text>
      </g>

      <!-- Info Box: Explicación de diferenciación de roles -->
      <g transform="translate(0, 265)">
        <rect width="318" height="75" class="note-box" />
        <text x="14" y="22" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#0F172A">Diferenciación de roles del sistema:</text>
        <!-- Textos resumidos ligeramente para evitar desbordamiento en móvil -->
        <text x="14" y="42" font-family="Inter, sans-serif" font-size="10" fill="#475569">• Turista: Acceso a itinerarios y Favoritos.</text>
        <text x="14" y="58" font-family="Inter, sans-serif" font-size="10" fill="#475569">• Institucional (admin@...): Redirección al CMS.</text>
      </g>

      <!-- Link to Register -->
      <g transform="translate(0, 375)">
        <line x1="0" y1="0" x2="318" y2="0" stroke="#F1F5F9" stroke-width="1" />
        <text x="159" y="28" font-family="Inter, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
          ¿No tienes una cuenta? <tspan fill="#0F172A" font-weight="700">Regístrate aquí</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
